<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کافه کد | کافه کد</title>

    <!-- PWA -->
    <meta name="theme-color" content="#00bfa5">
    <link rel="manifest" href="manifest.json">

    <style>
        @import url('https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css');

        :root {
            --primary-color: #00bfa5;
            --dark-blue: #00796b;
            --white: #ffffff;
            --bg-light: #e0f2f1;
            --text-color: #333;
        }

        body {
            font-family: 'Vazir', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-color);
            overflow-x: hidden;
        }

        body.dark {
            background-color: #121212;
            color: #eee;
        }
        body.dark header {
            background: linear-gradient(135deg, #333, #000);
        }
        body.dark .product-card {
            background: #1e1e1e;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--dark-blue));
            color: var(--white);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .brand-name {
            font-size: 2.5rem;
            font-weight: bold;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background-color: var(--white);
            color: var(--dark-blue);
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background-color: var(--primary-color);
            color: var(--white);
            transform: scale(1.05);
        }

        .section-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
            display: none;
        }

        .section-container.active {
            display: block;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .product-img-wrapper {
            width: 100%;
            height: 250px;
            overflow: hidden;
            cursor: zoom-in;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }

        .product-card:hover .product-img {
            transform: scale(1.1);
        }

        /* سه نقطه */
        #menuToggle {
            position: fixed;
            right: 15px;
            top: 15px;
            font-size: 35px;
            cursor: pointer;
            z-index: 999;
        }

        #sideMenu {
            position: fixed;
            right: -250px;
            top: 0;
            width: 250px;
            height: 100%;
            background: #fff;
            box-shadow: -3px 0 10px rgba(0,0,0,0.2);
            padding: 20px;
            transition: 0.3s;
            z-index: 998;
        }

        .admin-panel {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 800px;
            border: 2px dashed var(--primary-color);
            display: none;
        }

        .edit-btn, .delete-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .edit-btn { background: var(--primary-color); }
        .delete-btn { background: #ff5252; }

        [contenteditable="true"] {
            border: 1px dashed var(--primary-color);
        }
    </style>
</head>
<body>

<header>
    <div class="brand-name">کافه کد</div>
    <img src="brandlogo.png" style="width:120px; margin-top:10px;">
</header>

<!-- سه نقطه -->
<div id="menuToggle">⋮</div>

<!-- منوی کناری -->
<div id="sideMenu">
    <h3>منوی سایت</h3>

    <button onclick="checkAdmin()" style="width:100%; padding:10px; background:#00796b; color:white; border:none; border-radius:5px;">
        ورود مدیر
    </button>

    <button onclick="toggleDarkMode()" style="width:100%; padding:10px; background:#00bfa5; color:white; border:none; border-radius:5px; margin-top:10px;">
        حالت تاریک / روشن
    </button>
</div>

<nav>
    <button class="nav-btn" onclick="openSection('logo')">لوگو</button>
    <button class="nav-btn" onclick="openSection('card')">کارت ویزیت</button>
    <button class="nav-btn" onclick="openSection('tract')">تراکت</button>
</nav>

<!-- پنل مدیریت -->
<div class="admin-panel" id="adminPanel">
    <h3>افزودن بخش جدید</h3>
    <input id="newSectionName" placeholder="نام بخش..." style="width:90%; padding:8px;">
    <button class="add-section-btn" onclick="addNewSection()">افزودن بخش</button>

    <hr>

    <h3>افزودن عکس جدید</h3>
    <input id="newImgTitle" placeholder="عنوان عکس" style="width:90%; padding:8px;">
    <input id="newImgDesc" placeholder="توضیحات عکس" style="width:90%; padding:8px; margin-top:5px;">
    <input id="newImgSrc" placeholder="نام فایل عکس (مثلاً logo4.png)" style="width:90%; padding:8px; margin-top:5px;">
    <button class="add-section-btn" onclick="addNewImage()">افزودن عکس</button>
</div>

<!-- بخش‌ها -->
<div id="logo" class="section-container active">
    <h2 class="section-title">گالری لوگو</h2>
    <div class="products-grid" id="grid-logo"></div>
</div>

<div id="card" class="section-container">
    <h2 class="section-title">گالری کارت ویزیت</h2>
    <div class="products-grid" id="grid-card"></div>
</div>

<div id="tract" class="section-container">
    <h2 class="section-title">گالری تراکت</h2>
    <div class="products-grid" id="grid-tract"></div>
</div>

<!-- مودال -->
<div id="imgModal" class="fullscreen-modal" onclick="closeModal()">
    <span class="close-modal">&times;</span>
    <img id="modalImg">
</div>

<script>
/* داده‌ها */
let sectionsData = {
    logo: [
        { title: "لوگوی کافه کد", desc: "طراحی مدرن و مینیمال", img: "logo1.png" },
        { title: "لوگوی خیاطی", desc: "خیاطی خوش پوش", img: "logo2.png" },
        { title: "لوگوی مبلمان", desc: "مبلمان رفیعی", img: "logo3.png" }
    ],
    card: [
        { title: "کارت ویزیت کافه کد", desc: "قابلیت شخصی سازی متن", img: "card1.png" },
        { title: "کارت ویزیت خیاطی", desc: "درج شعار و لینک سایت", img: "card2.png" },
        { title: "کارت ویزیت مبلمان", desc: "طراحی لوکس", img: "card3.png" }
    ],
    tract: [
        { title: "تراکت تبلیغاتی", desc: "قابل اسکن وجود لینک سایت", img: "tract1.png" },
        { title: "تراکت تبلیغاتی", desc: "طراحی رنگی", img: "tract2.png" },
        { title: "تراکت تبلیغاتی", desc: "معرفی خدمات", img: "tract3.png" }
    ]
};

let isAdmin = false;

/* رندر بخش‌ها */
function renderSections() {
    for (const [sectionId, items] of Object.entries(sectionsData)) {
        const container = document.getElementById(`grid-${sectionId}`);
        container.innerHTML = "";

        items.forEach((item, index) => {
            const card = document.createElement("div");
            card.className = "product-card";

            card.innerHTML = `
                <div class="product-img-wrapper" onclick="openModal('${item.img}')">
                    <img src="${item.img}" class="product-img">
                </div>
                <div class="product-info">
                    <h3 class="product-title" id="title-${sectionId}-${index}">${item.title}</h3>
                    <p class="product-desc" id="desc-${sectionId}-${index}">${item.desc}</p>
                    ${isAdmin ? `
                        <button class="edit-btn" onclick="toggleEdit(this)">ویرایش</button>
                        <button class="delete-btn" onclick="deleteItem('${sectionId}', ${index})">حذف</button>
                    ` : ""}
                </div>
            `;
            container.appendChild(card);
        });
    }
}

/* باز کردن بخش */
function openSection(id) {
    document.querySelectorAll(".section-container").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* مودال */
function openModal(src) {
    document.getElementById("modalImg").src = src;
    document.getElementById("imgModal").style.display = "flex";
}
function closeModal() {
    document.getElementById("imgModal").style.display = "none";
}

/* ورود مدیر */
function checkAdmin() {
    const pass = prompt("رمز عبور را وارد کنید:");
    if (pass === "mmom26326@gmail.com") {
        isAdmin = true;
        document.getElementById("adminPanel").style.display = "block";
        renderSections();
        alert("ورود موفق!");
    } else {
        alert("رمز اشتباه است.");
    }
}

/* افزودن بخش */
function addNewSection() {
    const name = newSectionName.value.trim();
    if (!name) return alert("نام بخش را وارد کنید");

    const key = name.toLowerCase().replace(/\s+/g, "");
    if (sectionsData[key]) return alert("این بخش وجود دارد");

    sectionsData[key] = [];

    const btn = document.createElement("button");
    btn.className = "nav-btn";
    btn.innerText = name;
    btn.onclick = () => openSection(key);
    document.querySelector("nav").appendChild(btn);

    const div = document.createElement("div");
    div.id = key;
    div.className = "section-container";
    div.innerHTML = `
        <h2 class="section-title">${name}</h2>
        <div class="products-grid" id="grid-${key}"></div>
    `;
    document.body.appendChild(div);

    renderSections();
}

/* افزودن عکس */
function addNewImage() {
    const title = newImgTitle.value.trim();
    const desc = newImgDesc.value.trim();
    const src = newImgSrc.value.trim();

    if (!title || !desc || !src) return alert("همه فیلدها لازم است");

    const active = document.querySelector(".section-container.active").id;

    sectionsData[active].push({ title, desc, img: src });
    renderSections();
    alert("عکس اضافه شد!");
}

/* ویرایش */
function toggleEdit(btn) {
    const card = btn.closest(".product-card");
    const title = card.querySelector(".product-title");
    const desc = card.querySelector(".product-desc");

    if (title.isContentEditable) {
        title.contentEditable = false;
        desc.contentEditable = false;
        btn.innerText = "ویرایش";
    } else {
        title.contentEditable = true;
        desc.contentEditable = true;
        btn.innerText = "ذخیره";

        title.onblur = () => saveEdit(title.id, title.innerText);
        desc.onblur = () => saveEdit(desc.id, desc.innerText);
    }
}

function saveEdit(id, text) {
    const [type, section, index] = id.split("-");
    sectionsData[section][index][type] = text;
}

/* حذف */
function deleteItem(section, index) {
    if (confirm("حذف شود؟")) {
        sectionsData[section].splice(index, 1);
        renderSections();
    }
}

/* حالت تاریک */
function toggleDarkMode() {
    document.body.classList.toggle("dark");
}

/* سه نقطه */
menuToggle.onclick = () => {
    sideMenu.style.right = sideMenu.style.right === "0px" ? "-250px" : "0px";
};

/* ثبت سرویس ورکر */
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}

/* دکمه نصب اپ */
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;

    const installBtn = document.createElement("button");
    installBtn.innerText = "نصب اپ";
    installBtn.style.cssText = "width:100%; padding:10px; background:#00bfa5; color:white; border:none; border-radius:5px; margin-top:10px;";
    installBtn.onclick = () => {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => deferredPrompt = null);
    };

    sideMenu.appendChild(installBtn);
});

renderSections();
</script>

</body>
</html>
